<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Taokron TikTok Authorization</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#0a0f1a;color:#fff;
       text-align:center;padding:56px 20px;line-height:1.6}
  h1{font-size:1.5rem;margin:0 0 8px}
  #msg{color:#9fb0c8;margin-bottom:20px}
  .code{background:#111c2e;border:1px solid #243352;padding:18px;border-radius:10px;
        word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:15px;
        margin:18px auto;max-width:760px;user-select:all}
  .hint{color:#6b7c99;font-size:.95rem;margin-top:18px}
</style>
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
    t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
    y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);})(window, document, "clarity", "script", "x4n6j0p80n");
  </script>
</head>
<body>
  <h1>Taokron TikTok authorization</h1>
  <p id="msg">Reading authorization code…</p>
  <div class="code" id="code"></div>
  <p class="hint">Copy the code above and paste it back to Claude. You can close this tab afterwards.</p>
<script>
  var p = new URLSearchParams(location.search);
  var code = p.get('code'), err = p.get('error'), errd = p.get('error_description');
  var msg = document.getElementById('msg'), box = document.getElementById('code');
  if (code) { msg.textContent = 'Success. Your authorization code:'; box.textContent = code; }
  else if (err) { msg.textContent = 'Authorization error: ' + err; box.textContent = errd || err; }
  else { msg.textContent = 'No authorization code found in the URL.'; box.textContent = location.search || '(empty)'; }
</script>
</body>
</html>
